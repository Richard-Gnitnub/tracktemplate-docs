name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: Build HTML
    runs-on: ubuntu-24.04
    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate agent skills and guidance links
        run: python tools/validate_agent_skills.py

      - name: Build with warnings treated as errors
        run: python -m sphinx -b html -n -W --keep-going docs _build/html

      - name: Keep HTML for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracktemplate-developer-docs
          path: _build/html
          if-no-files-found: error
          retention-days: 14
