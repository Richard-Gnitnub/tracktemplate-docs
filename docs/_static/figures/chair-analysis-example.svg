<title id="title">Synthetic chair-position projection and analytical footprint</title>
<desc id="desc">Synthetic isolated T1 illustration in model millimetres. The timber is 4 mm wide and 30 mm long at centre (10, 0), with its length axis along y and width axis along x. The rail runs from (0, 4) to (20, 4). Projecting the timber centre gives support Q=(10, 4), distance 4 mm and station 10 mm along that rail from (0, 4) towards (20, 4). The analytical rectangle is 29/6 mm along y and 8/3 mm along x, following the retained macro&#x27;s source-labelled S1 footprint at fixed scale 1:76.2. Its corners are (26/3, 19/12), (26/3, 77/12), (34/3, 77/12), (34/3, 19/12). The minimum side and end clearances are 2/3 and 103/12 mm respectively. Both views use equal x/y scale; the lower view magnifies both axes by five and crops to x=7..13, y=0.5..7.5. The orange rectangle is an analytical footprint, not a physical chair. Position identity: TO-001:chair:to-001-timber-t1:main-side-stock-rail. Independent rational arithmetic only; no captured REA or FreeCAD output and no full-turnout or physical fit acceptance.</desc>
