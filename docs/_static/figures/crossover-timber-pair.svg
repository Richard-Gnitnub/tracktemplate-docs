<title id="title">Illustrative crossover timber overlap and candidate movement</title>
<desc id="desc">Independent rectangle arithmetic in model millimetres, not captured REA or FreeCAD output. A is 2 by 30 at centre (0, 0); B is 2 by 30 at (1, 10). The original overlap is 20 square millimetres. The shared enclosing width of 3 millimetres exceeds the allowed 2.35. The candidate moves A by -0.75 and B by +0.75 millimetres along x, giving a 0.50 millimetre gap. Black dots mark the unchanged original support centres in both panels. Each detail enlarges both x and y by four and crops to x=-2.5 to 3.5 and y=-1 to 11. Strict 0.25 millimetre movement limits cannot clear this pair. This illustration does not establish whole-arrangement acceptance.</desc>
