<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Centreline fixing-hole station example</title>
  <desc id="desc">An ideal straight 400 millimetre section of a 32 millimetre track strip has fixing holes at 104.1 and 295.9 millimetres. The corresponding board holes copy their planar positions. A six millimetre tongue is sketched at a joint. The hole circles are enlarged for clarity.</desc>
  <rect width="1080" height="380" rx="10" fill="#f8fafc"/>
  <style>
    text {font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17324d;}
    .title {font-size: 21px; font-weight: 700;}
    .label {font-size: 16px; font-weight: 600;}
    .small {font-size: 13.5px;}
    .dim {font-size: 13px; fill:#32516b;}
    .guide {stroke:#aebccc;stroke-width:1.5;stroke-dasharray:5 5;}
  </style>
  <text class="title" x="48" y="37">400 mm individual track section · 32 mm strip width</text>
  <text class="label" x="48" y="76">Track-template strip</text>
  <path d="M104 91 H904 V111 H916 V127 H904 V145 H104 Z" fill="#d5e7f5" stroke="#1e5a86" stroke-width="2"/>
  <line x1="104" y1="118" x2="904" y2="118" stroke="#4d84a8" stroke-dasharray="9 6" stroke-width="1.5"/>
  <line x1="904" y1="69" x2="904" y2="170" stroke="#c26532" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="312.2" cy="118" r="7" fill="#fff" stroke="#165c9a" stroke-width="3"/>
  <circle cx="695.8" cy="118" r="7" fill="#fff" stroke="#165c9a" stroke-width="3"/>
  <text class="small" x="242" y="104">Hole 1</text>
  <text class="small" x="623" y="104">Hole 2</text>
  <text class="small" x="924" y="114">6 mm</text>
  <text class="small" x="924" y="132">tongue</text>
  <line x1="104" y1="168" x2="904" y2="168" stroke="#50718c" stroke-width="1.5"/>
  <path d="M104 162 V174 M904 162 V174" stroke="#50718c" stroke-width="1.5"/>
  <text class="dim" x="98" y="189">0</text>
  <text class="dim" x="890" y="189">400 mm</text>
  <text class="dim" x="272" y="189">104.1 mm</text>
  <text class="dim" x="655" y="189">295.9 mm</text>
  <line class="guide" x1="312.2" y1="146" x2="312.2" y2="296"/>
  <line class="guide" x1="695.8" y1="146" x2="695.8" y2="296"/>
  <text class="label" x="48" y="222">Formation board</text>
  <rect x="83" y="234" width="856" height="70" rx="7" fill="#e9ddc4" stroke="#946d38" stroke-width="2"/>
  <path d="M104 269 H904" stroke="#a28b64" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="312.2" cy="269" r="7" fill="#fff" stroke="#165c9a" stroke-width="3"/>
  <circle cx="695.8" cy="269" r="7" fill="#fff" stroke="#165c9a" stroke-width="3"/>
  <text class="small" x="126" y="290">Same nominal station positions if matching holes are enabled</text>
  <rect x="46" y="327" width="988" height="37" rx="5" fill="#edf1f5"/>
  <text class="small" x="60" y="350">Joint guard = 6 + 0.2 + 1 + 1 = 8.2 mm  ·  Holes are centred at 25% and 75% of the usable interval.</text>
</svg>
